<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf0fb">
<title>登录 · Linely</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a84ff'/%3E%3Cpath d='M9 8h4v12h9v4H9z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<main class="shell">
  <section class="hero" aria-hidden="true">
    <div class="brand-lg"><span class="mark"><svg viewBox="0 0 32 32"><path d="M9 8h4v12h9v4H9z" fill="currentColor"/></svg></span><b>Linely</b></div>
    <h2>和 AI 好友<br>像聊天一样自然</h2>
    <p>角色、语音通话、表情包与气泡工坊，一个账号随时同步体验。</p>
    <div class="demo">
      <div class="bub in">早安呀～今天想聊点什么？</div>
      <div class="bub out">给我推荐一首适合下雨天听的歌吧</div>
      <div class="bub in typing"><i></i><i></i><i></i></div>
    </div>
  </section>

  <section class="card" aria-labelledby="title">
    <div class="logo"><span class="mark"><svg viewBox="0 0 32 32"><path d="M9 8h4v12h9v4H9z" fill="currentColor"/></svg></span></div>
    <h1 id="title">欢迎回来</h1>
    <p class="sub" id="sub">登录你的 Linely 账号</p>

    <div class="seg" role="tablist" aria-label="登录或注册">
      <i class="pill"></i>
      <button type="button" id="tabLogin" role="tab" aria-selected="true">登录</button>
      <button type="button" id="tabReg" role="tab" aria-selected="false">注册</button>
    </div>

    <form id="form" novalidate autocomplete="on">
      <div class="field">
        <label for="username">用户名</label>
        <div class="input"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z"/></svg>
          <input id="username" name="username" type="text" inputmode="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" placeholder="3–24 位字母、数字、下划线或中文" required></div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <div class="input"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 00-10 0v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zM9 6a3 3 0 016 0v2H9V6z"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="至少 8 位" required>
          <button type="button" class="eye" id="eye" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12.5 2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg></button></div>
        <div class="strength reg-only" id="strength" hidden><span></span><span></span><span></span><span></span><em id="strengthText"></em></div>
      </div>

      <div class="field reg-only" id="confirmField" hidden>
        <label for="confirm">确认密码</label>
        <div class="input"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" placeholder="再输入一次密码"></div>
      </div>

      <div class="field">
        <label for="captcha">验证码</label>
        <div class="captcha">
          <div class="input"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm-1 15l-4-4 1.4-1.4L11 13.2l5.6-5.6L18 9l-7 7z"/></svg>
            <input id="captcha" name="captcha" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6" placeholder="输入图中字符" required></div>
          <button type="button" class="cap-img" id="capBtn" aria-label="看不清？点击换一张"><img id="capImg" alt="验证码" width="160" height="56"><span class="cap-spin"></span></button>
        </div>
        <div class="hint">看不清？点击图片换一张 · 不区分大小写</div>
      </div>

      <input class="hp" type="text" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="error" id="err" role="alert" aria-live="assertive" hidden></div>

      <button class="go" id="go" type="submit"><span class="go-label">登录</span><span class="go-spin" aria-hidden="true"></span></button>
      <p class="switch-hint" id="switchHint">还没有账号？<button type="button" id="toReg">立即注册</button></p>
    </form>
  </section>
</main>
<script src="/auth.js"></script>
</body>
</html>
